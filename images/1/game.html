<html>
  <body>
    <style>
      .piece {
        position: absolute;
        transition: all 0.2s ease-in-out;
        /*	border:2px solid gray; */
      }
      #picture {
        position: absolute;
        left: 10px;
        top: 10px;
        display: block;
        /*	border:1px solid gray; */
      }
      body {
        border: 0px;
        margin: 0px;
        background-color: #444;
      }
      .pieceBorderTop {
        position: absolute;
        background: -moz-linear-gradient(top, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0) 40%); /* FF3.6+ */
        background: -webkit-gradient(
          linear,
          left top,
          left bottom,
          color-stop(0%, rgba(255, 255, 255, 1)),
          color-stop(40%, rgba(255, 255, 255, 0))
        ); /* Chrome,Safari4+ */
        background: -webkit-linear-gradient(
          top,
          rgba(255, 255, 255, 1) 0%,
          rgba(255, 255, 255, 0) 40%
        ); /* Chrome10+,Safari5.1+ */
        background: -o-linear-gradient(top, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0) 40%); /* Opera 11.10+ */
        background: -ms-linear-gradient(top, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0) 40%); /* IE10+ */
        background: linear-gradient(to bottom, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0) 40%); /* W3C */
        filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#ffffff', endColorstr='#00ffffff',GradientType=0 ); /* IE6-9 */
        opacity: 1;
        transition: opacity 1s;
      }
      .pieceBorderLeft {
        position: absolute;
        background: -moz-linear-gradient(left, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0) 40%); /* FF3.6+ */
        background: -webkit-gradient(
          linear,
          left top,
          right top,
          color-stop(0%, rgba(255, 255, 255, 1)),
          color-stop(40%, rgba(255, 255, 255, 0))
        ); /* Chrome,Safari4+ */
        background: -webkit-linear-gradient(
          left,
          rgba(255, 255, 255, 1) 0%,
          rgba(255, 255, 255, 0) 40%
        ); /* Chrome10+,Safari5.1+ */
        background: -o-linear-gradient(left, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0) 40%); /* Opera 11.10+ */
        background: -ms-linear-gradient(left, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0) 40%); /* IE10+ */
        background: linear-gradient(to right, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0) 40%); /* W3C */
        filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#ffffff', endColorstr='#00ffffff',GradientType=1 ); /* IE6-9 */
        opacity: 1;
        transition: opacity 1s;
      }
      .pieceBorderBottom {
        position: absolute;
        background: -moz-linear-gradient(top, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 1) 100%); /* FF3.6+ */
        background: -webkit-gradient(
          linear,
          left top,
          left bottom,
          color-stop(60%, rgba(0, 0, 0, 0)),
          color-stop(100%, rgba(0, 0, 0, 1))
        ); /* Chrome,Safari4+ */
        background: -webkit-linear-gradient(
          top,
          rgba(0, 0, 0, 0) 60%,
          rgba(0, 0, 0, 1) 100%
        ); /* Chrome10+,Safari5.1+ */
        background: -o-linear-gradient(top, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 1) 100%); /* Opera 11.10+ */
        background: -ms-linear-gradient(top, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 1) 100%); /* IE10+ */
        background: linear-gradient(to bottom, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 1) 100%); /* W3C */
        filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#00000000', endColorstr='#000000',GradientType=0 ); /* IE6-9 */
        opacity: 1;
        transition: opacity 1s;
      }
      .pieceBorderRight {
        position: absolute;
        background: -moz-linear-gradient(left, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 1) 100%); /* FF3.6+ */
        background: -webkit-gradient(
          linear,
          left top,
          right top,
          color-stop(60%, rgba(0, 0, 0, 0)),
          color-stop(100%, rgba(0, 0, 0, 1))
        ); /* Chrome,Safari4+ */
        background: -webkit-linear-gradient(
          left,
          rgba(0, 0, 0, 0) 60%,
          rgba(0, 0, 0, 1) 100%
        ); /* Chrome10+,Safari5.1+ */
        background: -o-linear-gradient(left, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 1) 100%); /* Opera 11.10+ */
        background: -ms-linear-gradient(left, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 1) 100%); /* IE10+ */
        background: linear-gradient(to right, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 1) 100%); /* W3C */
        filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#00000000', endColorstr='#000000',GradientType=1 ); /* IE6-9 */
        opacity: 1;
        transition: opacity 1s;
      }
      .selectedCover {
        position: absolute;
        background-color: white;
        opacity: 0.3;
        -moz-opacity: 0.3;
        filter: alpha(opacity=30);
        top: 0px;
        left: 0px;
      }
    </style>

    <div id="picture"></div>

    <script>
      function Piece(filename, places, left, top, width, height) {
        var theThis = this;
        var div = null;
        var img = null;
        var css = null;
        var atIndex = -1;
        var runWhenLoaded = null;
        var loaded = false;
        var mouseDownFunction = null;
        var mouseMoveFunction = null;
        var selectionCover = null;

        this.inRightPlace = function () {
          return places[atIndex].filename == filename;
        };

        function scale(number) {
          return parseInt(number / 4);
        }

        this.getIndex = function () {
          return atIndex;
        };

        this.onMouseDown = function (func) {
          mouseDownFunction = func;
        };
        this.onMouseMove = function (func) {
          mouseMoveFunction = func;
        };
        function init() {
          css = {
            left: scale(left) + "px",
            top: scale(top) + "px",
            height: scale(height) + "px",
            width: scale(width) + "px",
          };
          div = document.createElement("div");
          div.classList.add("piece");
          Object.assign(div.style, css);
          div.style.zIndex = "1";
          img = document.createElement("img");
          img.src = filename;
          img.style.width = "100%";
          img.style.height = "100%";
          selectionCover = document.createElement("div");
          selectionCover.classList.add("selectedCover");
          selectionCover.style.width = "100%";
          selectionCover.style.height = "100%";
          selectionCover.style.display = "none";
          img.addEventListener("dragstart", function (event) {
            event.preventDefault();
          });
          img.addEventListener("mousedown", function (event) {
            if (mouseDownFunction != null) mouseDownFunction(event, theThis);
          });
          img.addEventListener("mousemove", function (event) {
            if (mouseMoveFunction != null) mouseMoveFunction(event, theThis);
          });
          selectionCover.addEventListener("mousedown", function (event) {
            if (mouseDownFunction != null) mouseDownFunction(event, theThis);
          });

          div.appendChild(img);
          div.appendChild(selectionCover);
          img.onload = function () {
            addBorder();
            if (runWhenLoaded != null) {
              setTimeout(runWhenLoaded, 450);
            }
            loaded = true;
          };
        }

        this.addSelection = function (andBulge) {
          selectionCover.style.display = "block";
          var bigger = 6;
          div.style.zIndex = "2";
          if (andBulge) {
            div.style.zIndex = "3";
            div.style.left = parseInt(div.style.left) - bigger + "px";
            div.style.top = parseInt(div.style.top) - bigger + "px";
            div.style.width = parseInt(div.style.width) + 2 * bigger + "px";
            div.style.height = parseInt(div.style.height) + 2 * bigger + "px";
          }
        };

        this.removeSelection = function () {
          div.style.zIndex = "1";
          selectionCover.style.display = "none";
          div.style.left = scale(places[atIndex].left) + "px";
          div.style.top = scale(places[atIndex].top) + "px";
          div.style.width = scale(places[atIndex].width) + "px";
          div.style.height = scale(places[atIndex].height) + "px";
        };

        this.getDiv = function () {
          return div;
        };

        function addBorder() {
          var size = "4px";
          var sizepx = 4;
          var topBorder = document.createElement("div");
          topBorder.classList.add("pieceBorderTop");
          topBorder.style.width = "100%";
          topBorder.style.height = size;
          topBorder.style.top = "0";
          topBorder.style.left = "0";
          div.appendChild(topBorder);
          var bottomBorder = document.createElement("div");
          bottomBorder.classList.add("pieceBorderBottom");
          bottomBorder.style.width = "100%";
          bottomBorder.style.height = size;
          bottomBorder.style.bottom = "0";
          bottomBorder.style.left = "0";
          div.appendChild(bottomBorder);
          var leftBorder = document.createElement("div");
          leftBorder.classList.add("pieceBorderLeft");
          leftBorder.style.width = size;
          leftBorder.style.height = "100%";
          leftBorder.style.top = "0";
          leftBorder.style.left = "0";
          div.appendChild(leftBorder);
          var rightBorder = document.createElement("div");
          rightBorder.classList.add("pieceBorderRight");
          rightBorder.style.width = size;
          rightBorder.style.height = "100%";
          rightBorder.style.top = "0";
          rightBorder.style.right = "0";
          div.appendChild(rightBorder);
        }

        this.initialSlideTo = function (placeIndex) {
          function animate() {
            div.style.transition = "all 1s ease-in-out";
            div.style.left = scale(places[placeIndex].left) + "px";
            div.style.top = scale(places[placeIndex].top) + "px";
            div.style.width = scale(places[placeIndex].width) + "px";
            div.style.height = scale(places[placeIndex].height) + "px";
            atIndex = placeIndex;
          }

          if (loaded) {
            animate();
          } else {
            runWhenLoaded = function () {
              animate();
            };
          }
        };

        this.slideTo = function (placeIndex, speed, runAfter) {
          div.style.zIndex = "4";
          div.style.transition = "all " + speed / 1000 + "s ease-in-out";
          div.style.left = scale(places[placeIndex].left) + "px";
          div.style.top = scale(places[placeIndex].top) + "px";
          div.style.width = scale(places[placeIndex].width) + "px";
          div.style.height = scale(places[placeIndex].height) + "px";
          atIndex = placeIndex;
          setTimeout(function () {
            if (runAfter != null) runAfter();
            div.style.zIndex = "1";
          }, speed);
        };

        init();
      }

      function Picture() {
        var theThis = this;
        var onPiece = null;
        var dragging = false;
        var firstPiece = null;
        var lastPiece = null;
        var singleTapMode = false;
        var previousLastPiece = null;

        var places = [
          { filename: "1.jpg", left: 0, top: 1248, width: 1516, height: 1089 },
          { filename: "2.jpg", left: 0, top: 456, width: 1516, height: 792 },
          { filename: "3.jpg", left: 1516, top: 456, width: 756, height: 604 },
          { filename: "4.jpg", left: 1516, top: 1060, width: 756, height: 1277 },
          { filename: "5.jpg", left: 2272, top: 1248, width: 1284, height: 1089 },
          { filename: "6.jpg", left: 3556, top: 1060, width: 418, height: 1277 },
          { filename: "7.jpg", left: 2272, top: 584, width: 1284, height: 664 },
          { filename: "8.jpg", left: 3556, top: 584, width: 418, height: 476 },
          { filename: "9.jpg", left: 0, top: 0, width: 2272, height: 456 },
          { filename: "10.jpg", left: 2272, top: 0, width: 1702, height: 584 },
        ];
        var pictureWidth = 3974;
        var pictureHeight = 2337;
        var pieces = [];
        var pictureDiv = document.getElementById("picture");

        this.init = function () {
          var size = Math.min(pictureHeight, pictureWidth) / 4;
          var width = pictureWidth / 4;
          var height = pictureHeight / 4;
          var size = Math.min(width, height);
          var left = pictureWidth / 2 - size / 2;
          var top = pictureHeight / 2 - size / 2;
          for (var i = 0; i < places.length; i++) {
            pieces[i] = new Piece(places[i].filename, places, left, top, size, size);
          }
          place();
        };

        function makeRandomArray(size) {
          var spots = [];
          for (var i = 0; i < size; i++) {
            spots[i] = i;
          }
          for (var i = 0; i < size; i++) {
            var randomIndex = parseInt(Math.random() * size);
            var temp = spots[i];
            spots[i] = spots[randomIndex];
            spots[randomIndex] = temp;
          }
          return spots;
        }

        function place() {
          while (pictureDiv.firstChild) pictureDiv.removeChild(pictureDiv.firstChild);

          for (var i = 0; i < pieces.length; i++) {
            pictureDiv.appendChild(pieces[i].getDiv());
          }
          var randomSpots = makeRandomArray(pieces.length);
          for (var i = 0; i < pieces.length; i++) {
            pieces[i].initialSlideTo(randomSpots[i]);

            pieces[i].onMouseDown(function (event, piece) {
              mouseDown(piece, event);
            });
            pieces[i].onMouseMove(function (event, piece) {
              if (dragging) drag(piece, event);
            });
          }

          pictureDiv.addEventListener("mouseup", function () {
            if (dragging) doneDragging();
            dragging = false;
          });
        }

        function mouseDown(piece, event) {
          if (singleTapMode) {
            if (firstPiece == piece) {
              // user tapped here again to unselect
              unselect();
              singleTapMode = false;
              return;
            } else {
              swap(firstPiece, piece);
              singleTapMode = false;
              return;
            }
          }
          singleTapMode = false;
          previousLastPiece = null;

          dragging = true;
          onPiece = null;
          piece.addSelection(true);
          firstPiece = piece;
          lastPiece = firstPiece;
        }

        function unselect() {
          if (firstPiece != null) firstPiece.removeSelection();
          firstPiece = null;
          lastPiece = null;
        }

        function doneDragging() {
          if (firstPiece == lastPiece) {
            // single tap mode
            singleTapMode = true;
            return;
          }

          swap(firstPiece, lastPiece);
        }

        function drag(piece, event) {
          if (onPiece != piece) {
            draggedOnto(piece);
          }

          lastPiece = piece;
          onPiece = piece;
        }

        function draggedOnto(piece) {
          if (piece != firstPiece) {
            lastPiece = piece;
            piece.addSelection();
            if (previousLastPiece != null) previousLastPiece.removeSelection();
            previousLastPiece = piece;
          } else {
            if (previousLastPiece != null) previousLastPiece.removeSelection();
            lastPiece = firstPiece;
          }
        }

        function dragStart(img) {
          addSelection(img);
          img.addClass("dragStart");
        }

        function select(img) {
          var theImage = img;

          // the user tapped another piece, so swap them
          if ($(".selected").length > 0) {
            swap(img, $(".selected"));
            return;
          }

          addSelection(img);
        }

        function swap(piece1, piece2) {
          var index1 = piece1.getIndex();
          var index2 = piece2.getIndex();
          piece1.removeSelection();
          piece2.removeSelection();
          piece1.slideTo(index2, 500);
          piece2.slideTo(index1, 500, function () {
            checkWin();
          });
        }

        function checkWin() {
          var right = 0;
          for (var i = 0; i < pieces.length; i++) {
            if (pieces[i].inRightPlace()) {
              right++;
            }
          }

          if (right == pieces.length) {
            /*
			for(var i=0; i<pieces.length; i++) {
				if (pieces[i].inRightPlace()) {
					right++;
				}
			}
			*/
            var borders = document.querySelectorAll(
              ".pieceBorderTop, .pieceBorderBottom, .pieceBorderLeft, .pieceBorderRight"
            );
            Array.from(borders).forEach(function (b) {
              b.style.display = "none";
            });
            setTimeout(function () {
              Array.from(borders).forEach(function (b) {
                b.style.display = "block";
              });
              setTimeout(function () {
                Array.from(borders).forEach(function (b) {
                  b.style.opacity = "0";
                });
              }, 500);
            }, 500);
          }
        }
      }

      function Game() {
        var picture = new Picture();
        picture.init();
      }

      window.addEventListener("DOMContentLoaded", function () {
        var game = new Game();
      });
    </script>
  </body>
</html>
